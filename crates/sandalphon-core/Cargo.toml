[package]
name = "sandalphon-core"
version.workspace = true
edition.workspace = true
repository.workspace = true

[features]
serde = ["dep:serde"]
btree-storage = []

[dependencies]
bytes = { version = "1.12.1", default-features = false }
chacha20poly1305 = { version = "0.11.0", features = ["alloc", "zeroize"], default-features = false }
hkdf = { version = "0.13.0", default-features = false }
k256 = { version = "0.14.0", features = ["schnorr", "ecdh"], default-features = false }
rand_core = { version = "0.10.1", default-features = false }
serde = { version = "1.0.229", features = ["derive", "alloc"], default-features = false, optional = true }
sha2 = { version = "0.11.0", default-features = false }
thiserror = { version = "2.0.20", default-features = false }
zeroize = { version = "1.9.0", default-features = false, features = ["alloc"] }

[dev-dependencies]
getrandom = { version = "0.4.3", features = ["sys_rng"] }
