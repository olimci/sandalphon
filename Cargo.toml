[workspace]
resolver = "2"
members = [
    "crates/sandalphon-core",
    "crates/sandalphon-tokio",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/olimci/sandalphon"

[workspace.lints.clippy]
cognitive_complexity = "warn"
too_many_lines = "warn"
excessive_nesting = "warn"
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
